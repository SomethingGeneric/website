stages:
  - test
  - deploy

variables:
  IMAGE: node:24-trixie

# ----------------------------
# Test Build (Pull/Merge Request)
# ----------------------------
testbuild:
  stage: test
  image: $IMAGE
  rules:
    # Run only for merge requests (similar to PRs)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt update -yq && apt install -y make
    - npm i -g sharp
  script:
    - make build
  artifacts:
    name: "outputsite"
    paths:
      - dist/
    expire_in: 1 day

# ----------------------------
# GitLab Proxy Docker Build (Pull/Merge Request)
# ----------------------------
glproxy_docker_build:
  stage: test
  image: docker:26
  services:
    - name: docker:26-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - docker build --tag glproxy:test ./glproxy

# ----------------------------
# Production Build + Deploy (Push)
# ----------------------------
build_and_deploy:
  stage: deploy
  image: $IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: on_success
  before_script:
    - apt-get update -yq
    - apt-get install -y rsync openssh-client make
    - npm i -g sharp
    - mkdir -p ~/.ssh
    - echo "$SSHKEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    #- npm ci
    #- npm run build
    - make build
    - rsync -avc -e "ssh -p 2022" --delete dist/* "${SSH_USER}@${SSH_HOSTNAME}:${DESTPATH}/."
  artifacts:
    name: "outputsite"
    paths:
      - dist/
    expire_in: 7 days
