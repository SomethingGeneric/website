stages:
  - update
  - test
  - deploy

variables:
  IMAGE: node:24-trixie

# ----------------------------
# Test Build (Pull/Merge Request)
# ----------------------------
testbuild:
  stage: test
  image: $IMAGE
  rules:
    # Run only for merge requests (similar to PRs)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt update -yq && apt install -y make
    - npm i -g sharp
  script:
    - make build
  artifacts:
    name: "outputsite"
    paths:
      - dist/
    expire_in: 1 day

tj_course_refresh:
  stage: update
  image: $IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apt-get update -yq
    - apt-get install -y python3
  script:
    - python3 scripts/detect_courses.py --max-depth 1 --max-pages 4
    - |
      if git diff --quiet src/pages/techjournals/other-folks.astro; then
        echo "No techjournal updates found; skipping push."
        exit 0
      fi
      git config user.name "${CI_BOT_NAME:-tj-bot}"
      git config user.email "${CI_BOT_EMAIL:-tj-bot@example.com}"
      git add src/pages/techjournals/other-folks.astro
      git commit -m "update techjournal courses"
      git push "${GIT_PUSH_REMOTE:-origin}" HEAD:${CI_COMMIT_REF_NAME}

# ----------------------------
# Production Build + Deploy (Push)
# ----------------------------
build_and_deploy:
  stage: deploy
  image: $IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  before_script:
    - apt-get update -yq
    - apt-get install -y rsync openssh-client make
    - npm i -g sharp
    - mkdir -p ~/.ssh
    - echo "$SSHKEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    #- npm ci
    #- npm run build
    - make build
    - rsync -avc -e "ssh -p 2022" --delete dist/* "${SSH_USER}@${SSH_HOSTNAME}:${DESTPATH}/."
  artifacts:
    name: "outputsite"
    paths:
      - dist/
    expire_in: 7 days
